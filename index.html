<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ukeoppgaver</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Oppgaver">
<style>
  :root{
    --bg:#0b1220;
    --bg-2:#111c31;
    --card:#16233b;
    --card-2:#1d2d4a;
    --line:#27395c;
    --txt:#eaf0fb;
    --muted:#93a3c0;
    --accent:#38bdf8;
    --accent-2:#22d3ee;
    --done:#34d399;
    --done-dim:#10b981;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --r:18px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f7fc; --bg-2:#ffffff; --card:#ffffff; --card-2:#f0f4fb;
      --line:#dde5f2; --txt:#0f1c33; --muted:#61708c;
      --accent:#0284c7; --accent-2:#0891b2; --done:#059669; --done-dim:#10b981;
      --shadow:0 8px 24px rgba(20,40,80,.10);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-2), transparent 70%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100dvh;
    padding:
      calc(env(safe-area-inset-top) + 16px)
      calc(env(safe-area-inset-right) + 14px)
      calc(env(safe-area-inset-bottom) + 28px)
      calc(env(safe-area-inset-left) + 14px);
    max-width:620px; margin:0 auto;
  }

  /* ---------- Header ---------- */
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
  .title{font-size:1.5rem; font-weight:800; letter-spacing:-.02em; margin:0}
  .sub{color:var(--muted); font-size:.8rem; margin-top:3px}

  .ring{width:56px; height:56px; flex:0 0 auto; position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none; stroke-width:7; stroke-linecap:round}
  .ring .bg{stroke:var(--line)}
  .ring .fg{stroke:url(#g); transition:stroke-dasharray .5s cubic-bezier(.3,1.2,.5,1)}
  .ring b{
    position:absolute; inset:0; display:grid; place-items:center;
    font-size:.78rem; font-weight:800;
  }

  /* ---------- Week strip ---------- */
  .week{
    display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:16px;
  }
  .day{
    appearance:none; border:1px solid var(--line); background:var(--card);
    border-radius:14px; padding:9px 2px 8px; color:var(--txt);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; transition:transform .15s, background .2s, border-color .2s;
    position:relative; overflow:hidden;
  }
  .day:active{transform:scale(.94)}
  .day .dn{font-size:.68rem; font-weight:700; color:var(--muted); letter-spacing:.03em}
  .day .num{font-size:1.05rem; font-weight:800; line-height:1}
  .day .dots{display:flex; gap:3px; height:6px; align-items:center}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.55}
  .dot.done{background:var(--done); opacity:1}
  .day.free .dots::after{content:''; width:12px; height:2px; border-radius:2px; background:var(--line)}
  .day.today{border-color:var(--accent)}
  .day.today .num{color:var(--accent)}
  .day.sel{
    background:linear-gradient(160deg,var(--accent),var(--accent-2));
    border-color:transparent; color:#04121f;
  }
  .day.sel .dn{color:#04121f; opacity:.75}
  .day.sel .num{color:#04121f}
  .day.sel .dot{background:#04121f; opacity:.35}
  .day.sel .dot.done{background:#04121f; opacity:1}
  .day.allday::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(160deg, rgba(52,211,153,.18), transparent 60%);
    pointer-events:none;
  }

  /* ---------- Task panel ---------- */
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow); padding:16px; animation:pop .28s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes pop{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
  .panel h2{margin:0 0 2px; font-size:1.12rem; font-weight:800; letter-spacing:-.01em}
  .panel .meta{color:var(--muted); font-size:.8rem; margin-bottom:14px}

  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
  li.task{
    display:flex; align-items:center; gap:13px;
    background:var(--card-2); border:1px solid var(--line);
    border-radius:14px; padding:13px 14px; cursor:pointer;
    transition:transform .12s, background .2s, border-color .2s, opacity .2s;
    user-select:none;
  }
  li.task:active{transform:scale(.985)}
  li.task.done{border-color:color-mix(in srgb, var(--done) 45%, transparent)}
  li.task.done .label{text-decoration:line-through; opacity:.5}
  .check{
    width:28px; height:28px; flex:0 0 auto; border-radius:50%;
    border:2px solid var(--line); display:grid; place-items:center;
    transition:background .2s, border-color .2s, transform .2s;
  }
  li.task.done .check{
    background:var(--done); border-color:var(--done); transform:scale(1.05);
  }
  .check svg{width:15px; height:15px; stroke:#04121f; stroke-width:3.4; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .25s ease .05s}
  li.task.done .check svg{stroke-dashoffset:0}
  .emoji{font-size:1.35rem; line-height:1}
  .label{font-weight:650; font-size:.98rem}
  .note{display:block; font-weight:500; font-size:.74rem; color:var(--muted); margin-top:2px}

  .empty{text-align:center; padding:26px 10px; color:var(--muted)}
  .empty .big{font-size:2.4rem; display:block; margin-bottom:8px}

  .banner{
    margin-top:14px; text-align:center; font-weight:700; font-size:.9rem;
    color:var(--done); background:color-mix(in srgb, var(--done) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--done) 35%, transparent);
    border-radius:14px; padding:11px;
  }

  footer{
    margin-top:18px; display:flex; align-items:center; justify-content:space-between;
    color:var(--muted); font-size:.74rem; gap:10px;
  }
  .reset{
    appearance:none; background:transparent; border:1px solid var(--line);
    color:var(--muted); border-radius:999px; padding:7px 13px; font-size:.74rem;
    cursor:pointer; font-weight:600;
  }
  .reset:active{transform:scale(.95)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
</svg>

<header>
  <div>
    <h1 class="title">Ukeoppgaver</h1>
    <div class="sub" id="weekLabel"></div>
  </div>
  <div class="ring">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle class="bg" cx="28" cy="28" r="24"/>
      <circle class="fg" id="ringFg" cx="28" cy="28" r="24" stroke-dasharray="0 151"/>
    </svg>
    <b id="ringTxt">0/6</b>
  </div>
</header>

<nav class="week" id="week"></nav>

<section class="panel" id="panel"></section>

<footer>
  <span id="resetInfo"></span>
  <button class="reset" id="resetBtn">Nullstill uka</button>
</footer>

<script>
(function(){
  "use strict";

  // ---- Oppgaveplan: dag 0 = mandag ... 6 = søndag ----
  const TASKS = [
    { id:"oppvask-man",  day:0, emoji:"🍽️", label:"Ta oppvasken",        note:"Tømme og fylle oppvaskmaskin" },
    { id:"trapp",        day:1, emoji:"🧹", label:"Vaske trappa",         note:"1 gang i uka" },
    { id:"oppvask-ons",  day:2, emoji:"🍽️", label:"Ta oppvasken",        note:"Tømme og fylle oppvaskmaskin" },
    { id:"bad",          day:3, emoji:"🚿", label:"Vaske badet nede",     note:"Do, servant, gulv" },
    { id:"oppvask-fre",  day:4, emoji:"🍽️", label:"Ta oppvasken",        note:"Tømme og fylle oppvaskmaskin" },
    { id:"rom",          day:5, emoji:"🛏️", label:"Rydde og vaske rommet", note:"Rydd først, støvsug etterpå" }
  ];

  const DAYS_SHORT = ["Man","Tir","Ons","Tor","Fre","Lør","Søn"];
  const DAYS_LONG  = ["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
  const STORE_KEY  = "ukeoppgaver.v1";

  // ---- Uke-hjelpere (mandag som ukestart) ----
  function mondayOf(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const shift = (x.getDay() + 6) % 7;      // søn=0 -> 6
    x.setDate(x.getDate() - shift);
    return x;
  }
  function weekKey(d){
    const m = mondayOf(d);
    const p = n => String(n).padStart(2,"0");
    return m.getFullYear() + "-" + p(m.getMonth()+1) + "-" + p(m.getDate());
  }
  function isoWeekNo(d){
    const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
    const first = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(((t - first)/86400000 - 3 + ((first.getDay()+6)%7)) / 7);
  }

  // ---- Tilstand: nullstilles automatisk når uka skifter ----
  const now       = new Date();
  const thisWeek  = weekKey(now);
  const monday    = mondayOf(now);
  const todayIdx  = (now.getDay() + 6) % 7;

  let state = { week:thisWeek, done:{} };
  try{
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if(raw && raw.week === thisWeek && raw.done) state = raw;
  }catch(e){ /* tom eller ødelagt lagring: start på nytt */ }

  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }
  save(); // skriver over forrige ukes data med en gang uka har skiftet

  let selected = todayIdx;

  const isDone     = id => !!state.done[id];
  const tasksFor   = i  => TASKS.filter(t => t.day === i);
  const dateFor    = i  => { const d = new Date(monday); d.setDate(d.getDate()+i); return d; };
  const buzz       = ms => { if(navigator.vibrate) navigator.vibrate(ms); };

  const weekEl  = document.getElementById("week");
  const panelEl = document.getElementById("panel");

  function renderHeader(){
    document.getElementById("weekLabel").textContent =
      "Uke " + isoWeekNo(now) + " · " + DAYS_LONG[todayIdx].toLowerCase();

    const total = TASKS.length;
    const done  = TASKS.filter(t => isDone(t.id)).length;
    const C = 2 * Math.PI * 24;
    document.getElementById("ringFg").setAttribute(
      "stroke-dasharray", (C * done / total).toFixed(1) + " " + C.toFixed(1));
    document.getElementById("ringTxt").textContent = done + "/" + total;

    const left = total - done;
    document.getElementById("resetInfo").textContent =
      left === 0 ? "Alt er gjort denne uka 🎉"
                 : left + (left === 1 ? " oppgave igjen" : " oppgaver igjen") + " · nullstilles mandag";
  }

  function renderWeek(){
    weekEl.innerHTML = "";
    for(let i=0;i<7;i++){
      const list = tasksFor(i);
      const done = list.filter(t => isDone(t.id)).length;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "day"
        + (i === selected ? " sel" : "")
        + (i === todayIdx ? " today" : "")
        + (list.length === 0 ? " free" : "")
        + (list.length > 0 && done === list.length ? " allday" : "");
      b.setAttribute("aria-label", DAYS_LONG[i] + ", " + done + " av " + list.length + " gjort");
      b.setAttribute("aria-pressed", String(i === selected));

      const dots = list.map(t =>
        '<i class="dot' + (isDone(t.id) ? " done" : "") + '"></i>').join("");

      b.innerHTML =
        '<span class="dn">' + DAYS_SHORT[i] + '</span>' +
        '<span class="num">' + dateFor(i).getDate() + '</span>' +
        '<span class="dots">' + dots + '</span>';

      b.addEventListener("click", () => { selected = i; buzz(8); renderWeek(); renderPanel(); });
      weekEl.appendChild(b);
    }
  }

  function renderPanel(){
    const list = tasksFor(selected);
    const d    = dateFor(selected);
    const head =
      '<h2>' + DAYS_LONG[selected] + (selected === todayIdx ? " · i dag" : "") + '</h2>' +
      '<div class="meta">' + d.getDate() + "." + (d.getMonth()+1) + "." + d.getFullYear() + '</div>';

    if(list.length === 0){
      panelEl.innerHTML = head +
        '<div class="empty"><span class="big">🎈</span>Fri dag – ingen oppgaver</div>';
      return;
    }

    const ul = document.createElement("ul");
    list.forEach(t => {
      const li = document.createElement("li");
      li.className = "task" + (isDone(t.id) ? " done" : "");
      li.tabIndex = 0;
      li.setAttribute("role","checkbox");
      li.setAttribute("aria-checked", String(isDone(t.id)));
      li.innerHTML =
        '<span class="check"><svg viewBox="0 0 24 24"><polyline points="4,12.5 9.5,18 20,6.5"/></svg></span>' +
        '<span class="emoji">' + t.emoji + '</span>' +
        '<span class="label">' + t.label + '<span class="note">' + t.note + '</span></span>';

      const toggle = () => {
        if(state.done[t.id]) delete state.done[t.id];
        else state.done[t.id] = true;
        buzz(state.done[t.id] ? [12,40,18] : 8);
        save(); renderWeek(); renderPanel(); renderHeader();
      };
      li.addEventListener("click", toggle);
      li.addEventListener("keydown", e => {
        if(e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(); }
      });
      ul.appendChild(li);
    });

    panelEl.innerHTML = head;
    panelEl.appendChild(ul);

    if(list.every(t => isDone(t.id))){
      const b = document.createElement("div");
      b.className = "banner";
      b.textContent = "Ferdig for " + DAYS_LONG[selected].toLowerCase() + "! 💪";
      panelEl.appendChild(b);
    }
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if(!confirm("Nullstille alle oppgaver for denne uka?")) return;
    state = { week:thisWeek, done:{} };
    save(); renderWeek(); renderPanel(); renderHeader();
  });

  // Ny dag / ny uke mens appen ligger åpen i bakgrunnen
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && weekKey(new Date()) !== thisWeek) location.reload();
  });

  renderHeader(); renderWeek(); renderPanel();

  // Offline-støtte: appen starter uten nett etter første besøk
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
